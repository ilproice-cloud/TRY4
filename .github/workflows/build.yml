
name: Build RealmForge from ZIP

on:
  workflow_dispatch:
  push:
    paths:
      - 'RealmForge-Fabric-1.21.1-Fixed.zip'
      - '.github/workflows/build.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Download repository files
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Find and extract RealmForge ZIP
        shell: bash
        run: |
          set -euo pipefail

          ZIP_FILE="RealmForge-Fabric-1.21.1-Fixed.zip"

          if [ ! -f "$ZIP_FILE" ]; then
            echo "ERROR: $ZIP_FILE was not found in repository root."
            ls -la
            exit 1
          fi

          mkdir -p extracted
          unzip -q "$ZIP_FILE" -d extracted

          BUILD_FILE="$(find extracted -type f -name build.gradle -print -quit)"

          if [ -z "$BUILD_FILE" ]; then
            echo "ERROR: build.gradle not found inside ZIP."
            exit 1
          fi

          echo "PROJECT_DIR=$(dirname "$BUILD_FILE")" >> "$GITHUB_ENV"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Compile RealmForge
        shell: bash
        run: |
          set -euo pipefail
          cd "$PROJECT_DIR"
          gradle --no-daemon clean build

      - name: Collect JAR files
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist

          find "$PROJECT_DIR/build/libs" \
            -maxdepth 1 -type f -name '*.jar' \
            ! -name '*-sources.jar' \
            -exec cp {} dist/ \;

          if ! compgen -G 'dist/*.jar' > /dev/null; then
            echo "ERROR: No compiled JAR was produced."
            exit 1
          fi

      - name: Upload compiled JAR
        uses: actions/upload-artifact@v4
        with:
          name: RealmForge-Fabric-1.21.1-JAR
          path: dist/*.jar
          if-no-files-found: error
          retention-days: 30
