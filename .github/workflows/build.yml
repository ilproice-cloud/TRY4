
name: Build RealmForgeVer2

on:
  workflow_dispatch:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Install Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.8"

      - name: Extract Project ZIP
        run: |
          mkdir -p extracted
          unzip -o RealmForgeVer2-OnePage-Fused.zip -d extracted
          find extracted -name build.gradle -o -name build.gradle.kts

      - name: Build Mod
        run: |
          BUILD_FILE=$(find extracted \( -name build.gradle -o -name build.gradle.kts \) -type f | head -n 1)
          if [ -z "$BUILD_FILE" ]; then
            echo "ERROR: No Gradle build file found inside ZIP."
            exit 1
          fi
          PROJECT_DIR=$(dirname "$BUILD_FILE")
          cd "$PROJECT_DIR"
          gradle build

      - name: Upload Mod JAR
        uses: actions/upload-artifact@v4
        with:
          name: RealmForgeVer2
          path: extracted/**/build/libs/*.jar
          if-no-files-found: error
