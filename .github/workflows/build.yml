
name: Build RealmForge from ZIP

on:
  workflow_dispatch:
  push:
    branches: [main, master]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract ZIP automatically
        run: |
          set -euo pipefail
          ZIP_FILE="$(find . -maxdepth 2 -type f -iname 'RealmForge*.zip' | head -n 1)"
          if [ -z "$ZIP_FILE" ]; then
            echo "RealmForge ZIP not found"
            exit 1
          fi
          mkdir -p extracted
          unzip -q "$ZIP_FILE" -d extracted
          BUILD_FILE="$(find extracted -type f -name build.gradle -print -quit)"
          if [ -z "$BUILD_FILE" ]; then
            echo "build.gradle not found in ZIP"
            exit 1
          fi
          echo "PROJECT_DIR=$(dirname "$BUILD_FILE")" >> "$GITHUB_ENV"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Build JAR
        run: |
          set -euo pipefail
          cd "$PROJECT_DIR"
          gradle --no-daemon clean build
          mkdir -p "$GITHUB_WORKSPACE/dist"
          find build/libs -maxdepth 1 -name '*.jar' \
            ! -name '*-sources.jar' \
            -exec cp {} "$GITHUB_WORKSPACE/dist/" \;

      - uses: actions/upload-artifact@v4
        with:
          name: RealmForge-Fabric-1.21.1-JAR
          path: dist/*.jar
          if-no-files-found: error
          retention-days: 30
